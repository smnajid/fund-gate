# PROTOTYPE, ticket #31.
spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    model:
      chat: none          # the spring-ai profile turns the Anthropic ChatModel on
logging:
  level:
    root: warn
    org.apache.pdfbox: error
    org.apache.fontbox: error

fundgate:
  drafter: claude-plan    # claude-plan | spring-ai
  docs-dir: docs
  runs-dir: runs
  extract-model: claude-opus-5-5
  normalise-model: claude-sonnet-5-5
  fund:
    name: Global Climate and Environment Fund
    display-name: Nordea 1 – Global Climate and Environment Fund
    prospectus: prospectus
    prospectus-title: Nordea 1, SICAV prospectus June 2026
    share-classes:
      BP-EUR: LU0348926287
      BI-EUR: LU0348927095
    kids:
      BP-EUR: kid-BP-EUR
      BI-EUR: kid-BI-EUR
