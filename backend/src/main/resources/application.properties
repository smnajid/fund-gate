# Paths relative to backend/, where Maven runs
fundeli5.fixtures.dir=../docs/playbook/contracts/fixtures
# The sample PDFs, kept out of git in the extraction spike's folder
fundeli5.documents.folder=../spikes/java-rule-card-extraction/docs
# Replay mode: one recorded answer per file, so a run makes no model call
fundeli5.llm.recordings=src/main/resources/llm-recordings
# The model the pipeline asks, and the egress client's endpoint named on each Draft card. Replay matches on the
# model too: changing it means recording again
fundeli5.pipeline.model=claude-opus-5-5
fundeli5.llm.endpoint=replay
# The Draft Rule Cards the validation screen opens: the demo's, then those the pipeline wrote (its fundeli5.pipeline.out)
fundeli5.validation.drafts=${fundeli5.fixtures.dir}/draft-rule-cards,target/draft-rule-cards
